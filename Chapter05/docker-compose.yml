services:
  postgres:
    image: postgres:16-alpine
    container_name: elibrary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: elibrary_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - elibrary_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elibrary_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  elibrary_postgres_data:
